<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>J.A.R.V.I.S</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>J.A.R.V.I.S</h1>
        <p>PERSONAL AI ASSISTANT</p>
    </header>

    <!-- JARVIS CORE -->
    <div class="core">
        <div class="ring ring-one"></div>
        <div class="ring ring-two"></div>
        <div class="ring ring-three"></div>

        <div class="core-center"></div>
    </div>

    <div class="system-ready">
        SYSTEM READY
    </div>

    <!-- DIAGNOSTICS -->
    <section class="diagnostics">

        <h2>SYSTEM DIAGNOSTICS</h2>

        <div class="status-row">
            <span>AI ENGINE</span>
            <strong>OPERATIONAL</strong>
        </div>

        <div class="status-row">
            <span>CONNECTION</span>
            <strong>ONLINE</strong>
        </div>

        <div class="status-row">
            <span>VOICE INTERFACE</span>
            <strong>READY</strong>
        </div>

        <div class="status-row">
            <span>LONG-TERM MEMORY</span>
            <strong>ACTIVE</strong>
        </div>

    </section>

    <!-- CHAT -->
    <section class="chat-container">

        <div id="chat" class="chat"></div>

        <div class="input-area">

            <input
                id="msg"
                type="text"
                placeholder="Enter a command for J.A.R.V.I.S..."
                autocomplete="off"
            >

            <button id="send">SEND</button>

            <button id="mic-btn" type="button" aria-label="Voice input">
                🎤
            </button>

            <button id="cam-btn" type="button" aria-label="Image input">
                📷
            </button>

            <button id="clear-btn" type="button">
                CLEAR MEMORY
            </button>

            <input
                type="file"
                id="img-input"
                accept="image/*"
                capture="environment"
                hidden
            >

        </div>

    </section>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
